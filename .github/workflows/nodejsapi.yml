name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/nodejsapi.yml'
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, tag, or commit SHA to deploy/revert to'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_TARGET_DIR: /home/u583298036/domains/api.thevingo.com/public_html/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Sync files
        run: |
          rsync -az --delete \
            -e "ssh -p 65002" \
            --exclude node_modules \
            --exclude .git \
            ./ ${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET_DIR}