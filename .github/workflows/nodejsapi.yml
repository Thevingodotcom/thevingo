name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/nodejsapi.yml'
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, tag, or commit SHA to deploy/revert to'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_TARGET_DIR: /home/u583298036/domains/api.thevingo.com/nodejs/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Test SSH
        run: ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no ${HOSTINGER_USER}@${HOSTINGER_HOST} "whoami"

      - name: Sync files
        run: |
          rsync -az --delete \
            -e "ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no" \
            --exclude .git \
            --exclude .env \
            ./ ${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_TARGET_DIR}

      - name: Install/Verify Node.js on Server
        run: |
          ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no ${HOSTINGER_USER}@${HOSTINGER_HOST} '
            # Install NVM if not present
            if [ ! -d "$HOME/.nvm" ]; then
              echo "Installing NVM..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            fi
            
            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Install & Use Node 20
            echo "Installing/Ensuring Node.js 20..."
            nvm install 20
            nvm use 20
            nvm alias default 20
          '

      - name: Create/Update .env file on Server
        run: |
          ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no ${HOSTINGER_USER}@${HOSTINGER_HOST} "cat << 'EOF' > ${HOSTINGER_TARGET_DIR}.env
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=${{ secrets.PORT }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          PURCHASE_SMTP_USER=${{ secrets.PURCHASE_SMTP_USER }}
          PURCHASE_SMTP_PASS=${{ secrets.PURCHASE_SMTP_PASS }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_API_URLTE_APP_URL=${{ secrets.VITE_API_URLTE_APP_URL }}
          EOF"

      - name: Install dependencies on Server
        run: |
          ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no ${HOSTINGER_USER}@${HOSTINGER_HOST} "
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
            cd ${HOSTINGER_TARGET_DIR}
            npm install --omit=dev
          "

      - name: Create Passenger .htaccess file in public_html
        run: |
          ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no ${HOSTINGER_USER}@${HOSTINGER_HOST} '
            mkdir -p /home/u583298036/domains/api.thevingo.com/public_html
            cat << "EOF" > /home/u583298036/domains/api.thevingo.com/public_html/.htaccess
            PassengerEnabled on
            PassengerAppEnv production
            PassengerAppRoot /home/u583298036/domains/api.thevingo.com/nodejs
            PassengerStartupFile server.js
            EOF
          '

      - name: Restart app
        run: |
          ssh -p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no ${HOSTINGER_USER}@${HOSTINGER_HOST} "
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
            cd ${HOSTINGER_TARGET_DIR}
            npx pm2 restart vingo-backend || npx pm2 start server.js --name \"vingo-backend\"
            mkdir -p tmp && touch tmp/restart.txt
          "

      - name: Success message
        if: success()
        run: echo "🎉 Thank you! The deployment was completed successfully."

      - name: Failure message
        if: failure()
        run: |
          echo "❌ Deployment failed! Please check the logs above to see what went wrong."
          exit 1
